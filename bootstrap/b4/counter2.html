<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <div class="container-fluid">
        <div class="row" style="background: pink;">

            </div>

<section id="counts" class="counts">

                <span data-toggle="counter-up" style="color: red;">9999</span>
                <p>Branches +</p>

            <div class="col-sm-3 text-center">
                <span data-toggle="counter-up">36000</span>

            </div>

                <span data-toggle="counter-up">8808</span>
                <p>Trainers +</p>
            </div>
            <div class="col-sm-3 text-center">
                <span data-toggle="counter-up">9909</span>
                <p>Branches +</p>
            </div>
        </div>
    </div>
</section>


    <script src="js/jquery.min.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
   <script src="js/owl.carousel.min.js"></script>
